    <style id="page-fade-style">
      html[data-page-fade] { background: #f5f3ec; }
      html[data-page-fade="pending"] body,
      html[data-page-fade="revealing"] body { transition: opacity 700ms cubic-bezier(0.22, 1, 0.36, 1) !important; }
      html[data-page-fade="pending"] body { opacity: 0 !important; }
      html[data-page-fade="revealing"] body { opacity: 1 !important; }
      html[data-page-fade] body > main { animation: none !important; }
      @media (prefers-reduced-motion: reduce) {
        html[data-page-fade] body { opacity: 1 !important; transition: none !important; }
      }
    </style>
    <script id="page-fade-init">
      (() => {
        const root = document.documentElement;
        const motion = matchMedia("(prefers-reduced-motion: reduce)");
        if (motion.matches) return;
        let shown = false;
        const reveal = (immediate = false) => {
          if (shown && !immediate) return;
          shown = true;
          clearTimeout(deadline);
          root.setAttribute("data-page-fade", immediate ? "complete" : "revealing");
          if (!immediate) setTimeout(() => root.setAttribute("data-page-fade", "complete"), 700);
        };
        const deadline = setTimeout(() => reveal(), 1800);
        document.addEventListener("page-fade-ready", () => reveal(), { once: true });
        addEventListener("pageshow", event => { if (event.persisted) reveal(true); });
        motion.addEventListener("change", event => { if (event.matches) reveal(true); });
        root.setAttribute("data-page-fade", "pending");
      })();
    </script>
