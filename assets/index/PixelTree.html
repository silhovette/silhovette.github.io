<title>Terracotta Tree — Layered Canopy Edition V13</title>
<style>

</head>
<body>
<main class="frame">
  <div class="stage" id="stage" role="img" aria-label="一棵陶土红色的像素秋树，可拖动树冠与枝叶互动">
    <canvas id="scene" width="600" height="360"></canvas>
  </div>
</main>
<script>
/*
 * TERRACOTTA TREE · Layered Canopy Edition
 * An original procedural pixel tree with articulated branches, distributed
 * canopy foliage, travelling wind waves, and individual tumbling leaves.
 * The bark uses a 1-bit alpha mask for genuinely sharp pixel boundaries.
 * Pixel-exact CPU foliage compositing replaces thousands of per-frame canvas
 * drawImage calls without changing geometry, color, physics or painter order.
 * Runs fully offline. Embed with PixelTree.html?embed=1

(() => {
'use strict';
const W=600,H=360;
const stage=document.querySelector('#stage');
const canvas=document.querySelector('#scene');
let ctx=canvas.getContext('2d',{alpha:true});
// The foreground context stays untouched while the wood is rasterized separately.
const displayCtx=ctx;
const barkCanvas=document.createElement('canvas');
barkCanvas.width=W;barkCanvas.height=H;
const barkCtx=barkCanvas.getContext('2d',{alpha:true,willReadFrequently:true});
barkCtx.imageSmoothingEnabled=false;
const embedded=new URLSearchParams(location.search).has('embed');

const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let seed=0xb9472c26;

const nodeList=[];
const root={x:303,y:298,rx:303,ry:298,restA:-PI/2,worldA:-PI/2,angle:0,v:0,children:[],depth:0,parent:null};

}

const trunk=[];

for(const [x,y,w] of [[302,279,11],[305,257,10],[304,233,8],[309,209,7],[306,186,6],[304,163,4.5],[310,143,3.1]]){

const limbs=[
 // First branches originate at different heights and grow at different pitches.
 {id:'lowLeft', a:0, pts:[[281,272],[252,259],[217,252],[173,240]],w:6.15},
 {id:'lowRight',a:1, pts:[[328,246],[361,226],[397,218],[446,198]],w:5.35},
 {id:'midLeft', a:2, pts:[[286,216],[261,191],[238,166],[207,139],[173,125]],w:5.30},
 {id:'midRight',a:3, pts:[[330,209],[355,184],[381,151],[406,126],[435,117]],w:5.65},
 {id:'upperLeft', a:4, pts:[[290,165],[275,137],[260,103],[249,67]],w:3.85},
 {id:'upperRight',a:5, pts:[[325,149],[347,116],[374,92],[404,79]],w:3.60},
 {id:'crown',a:6, pts:[[311,118],[303,92],[291,62]],w:3.05},
 // Forks grow *from existing branch nodes*, not from mirrored trunk levels.
 {id:'lowLeftFork',from:'lowLeft',at:1,pts:[[238,228],[213,203],[184,191]],w:3.65},
 {id:'lowRightFork',from:'lowRight',at:2,pts:[[421,236],[452,230]],w:2.6},

   const n=j===arr.length-1?7:j===arr.length-2?5:3;

     twigChains.push([from,mid,tip]);
     tips.push({node:tip,layer:(i+k+j)%6<2?-1:1,weight:j===arr.length-1?1:.82,phase:r(0,PI*2),rx:r(15,23),ry:r(11,18)});
   }

}

 twigChains.push([a,mid,tip]);

// Fill the open middle of the tree by growing secondary sprays from real joints.
// This is a layered crown, not a static sprite: each new spray follows its own
// articulated twig, so the previously sparse fork areas remain responsive.
const crownBridges=[
 [244,163,'midLeft',2,-1],[260,147,'upperLeft',1,1],
 [274,133,'upperLeft',0,-1],[291,142,'crown',0,1],
 [315,131,'crown',0,-1],[339,138,'upperRight',0,1],
 [362,158,'midRight',2,-1],[388,181,'midRight',2,1],
 [228,184,'midLeftFork',0,1],[252,190,'midLeft',1,-1],
 [273,179,'midLeft',0,1],[295,171,'crown',0,-1],
 [315,173,'midRight',0,1],[337,182,'midRight',1,-1],
 [353,199,'midRightFork',0,1],[244,212,'lowLeftFork',0,-1],
 [265,208,'midLeft',0,1],[286,204,'midLeft',0,1],
 [307,194,'midRight',0,-1],[326,213,'lowRight',0,1],
 [346,229,'lowRight',1,-1],[276,229,'lowLeft',0,1],
 [298,222,'lowLeft',0,-1],[316,239,'lowRight',0,1],
 [231,228,'lowLeftFork',0,-1],[375,222,'midRightFork',0,1],
 [276,158,'upperLeft',0,1],[336,156,'upperRight',0,-1],
 [294,113,'crown',1,1],[318,112,'crownFork',0,-1],
 [330,95,'crownFork',0,-1],[348,98,'upperRight',1,1],
 [362,108,'upperRight',1,-1],[345,118,'crownFork',0,1],
 [250,242,'lowLeft',1,1],[361,246,'lowRight',1,-1]
];
for(const [x,y,id,index,layer] of crownBridges){
 const anchor=limbLookup.get(id)[index];
 const mid=add(anchor,anchor.rx+(x-anchor.rx)*.53+r(-3,3),anchor.ry+(y-anchor.ry)*.53+r(-3,3),1.35,'twig');
 const tip=add(mid,x,y,.8,'twig');
 twigChains.push([anchor,mid,tip]);
 tips.push({node:tip,layer,weight:r(.97,1.17),phase:r(0,PI*2),rx:r(19,26),ry:r(13,20),bridge:true});
}
// Irregular shadow-filled recesses, all attached to the existing skeletal limbs.
// Drawn behind the old foliage AND the wood. They fill openings without putting
// generic dark blobs over branches or disturbing the front-lit crown silhouette.
const understoryPositions=[
 [219,184,'midLeftFork',0,21,14],[247,174,'midLeft',1,23,17],
 [262,193,'midLeft',1,22,17],[278,157,'midLeft',2,20,17],
 [290,184,'crown',0,23,17],[315,156,'crown',0,25,18],
 [333,173,'midRight',0,24,18],[349,189,'midRight',1,23,18],
 [377,196,'midRightFork',0,25,18],[402,210,'lowRight',2,23,15],
 [343,213,'lowRight',0,25,17],[308,218,'lowRight',0,21,15],
 [276,219,'lowLeft',0,24,17],[253,225,'lowLeftFork',0,23,14],
 [222,214,'lowLeftFork',1,24,14],[187,204,'midLeftFork',1,22,14],
 [256,129,'upperLeft',1,20,15],[286,119,'crown',0,22,16],
 [322,115,'crown',1,23,16],[357,133,'upperRight',0,22,16],
 [387,160,'midRight',2,24,17],[414,184,'midRightFork',1,22,14],
 [241,204,'lowLeftFork',0,22,16],[365,224,'lowRight',1,22,16]
];
for(const [x,y,id,index,rx,ry] of understoryPositions){
 const anchor=limbLookup.get(id)?.[index];
 if(!anchor)throw new Error('Missing shadow foliage anchor: '+id);
 const mid=add(anchor,anchor.rx+(x-anchor.rx)*.54,anchor.ry+(y-anchor.ry)*.54,1.15,'twig');
 const tip=add(mid,x,y,.72,'twig');
 twigChains.push([anchor,mid,tip]);
 tips.push({node:tip,layer:-2,weight:r(.89,1.12),phase:r(0,PI*2),rx,ry,understory:true});
}
// Each foliage group is a spray of *individually animated*, small, hard-edged leaves.
// Unlike a pre-rendered sprite, this means the silhouette keeps changing in the wind.
const sprays=[];
// A regrow advances the foliage generation instead of visiting every leaf.
// Only tiles changed by shedding ever need restoring.
let foliageGeneration=1;
const changedTiles=new Set();
const palette=[P.darkest,P.deep,P.shadow,P.red,P.ember,P.copper,P.orange,P.light,P.shine];
// Deep interior foliage is a second material palette, not a dark transparent
// overlay. This keeps fully opaque, crisp one-pixel edges when the tree moves.
const innerPalette=['#4d241e','#60271e','#702b21','#7e3024','#8c3528','#9b3b29','#a9432d','#b84c32','#c75a37'];
const leafCount=[96,140];
for(let s=0;s<tips.length;s++){
 const t=tips[s],leaves=[];
 const count=Math.round(r(...leafCount)*(t.weight+.02)*(t.bridge?1.08:1)*(t.understory?1.08:1));
 // Each spray has a dominant tone, but front/back, top/bottom, interior/exterior
 // and local canopy pockets all shift its shade. This gives volume at small size.
 const px=t.node.rx,py=t.node.ry;
 const crownHeight=clamp((240-py)/174,0,1);
 const sideLight=clamp((302-px)/232,-1,1);
 const shadePatch=1.02*Math.sin(px*.041+py*.016)+.68*Math.cos(py*.077-px*.027);
 const layerBias=t.layer===-2?-1.65:t.layer===-1?-1.48:.12;

 // More shade in low/inward-facing sprays, coherent per spray instead of random
 // isolated black pixels. Shadow depth is stronger in the back-layer cavities.
 const inward=clamp(1-Math.abs(px-301)/184,0,1);
 const lowCrown=clamp((py-114)/143,0,1);

 for(let j=0;j<count;j++){
   const a=r(0,2*PI),rad=Math.sqrt(rand());
   // Lopsided lobes and tiny irregular holes generate maple-like broken edges.
   const scallop=1+.16*Math.sin(3*a+s*.73)+.13*Math.cos(5*a+s*.31);
   const x=Math.cos(a)*t.rx*rad*scallop;
   const y=Math.sin(a)*t.ry*rad*(1+.11*Math.sin(4*a));
   // Keep exterior edges broken, but close up the inner crown around branches.
   if(rand()<(t.bridge?.018:.032) && rad>.86)continue;
   const interiorDark=rad<.54?-.32:rad>.82?.23:0;
   const topLight=-y/t.ry*.74;
   const sideShift=-x/t.rx*.18;
   const underside=clamp((y/t.ry+.1)*.42,0,.52);
   const lightIndex=clamp(Math.floor(clusterTone+topLight+sideShift+interiorDark-underside+r(-1.05,1.12)),0,8);
   const occluded=(rad<.76?1:.73)*(1+underside*.4);
   const col=(rand()<shadowGroup*occluded ? innerPalette : palette)[lightIndex];
   const size=r(0,1);
   leaves.push({ox:x,oy:y,col,tone:lightIndex,
     size:size<.10?1:size<.51?2:size<.92?3:4,shape:ri(0,4),phase:r(0,PI*2),
     flutter:r(3.0,7.0),drift:r(.58,1.25),shift:r(.7,1.35)});
 }
 const tones=Array.from({length:9},()=>[]);
 for(const l of leaves)tones[l.tone].push(l);
 sprays.push({...t,leaves,tones});
}
const deepSprays=sprays.filter(s=>s.layer===-2).sort((a,b)=>a.node.ry-b.node.ry||a.node.rx-b.node.rx);
const backSprays=sprays.filter(s=>s.layer===-1).sort((a,b)=>a.node.ry-b.node.ry||a.node.rx-b.node.rx);
const frontSprays=sprays.filter(s=>s.layer===1).sort((a,b)=>a.node.ry-b.node.ry||a.node.rx-b.node.rx);
// Tiny foliage tiles are independent moving leaflets, not one rigid crown image.
// Every tile is 11x11 px: thousands of tiny elastic pieces can flutter smoothly.
function tilePixel(c,x,y,w,h,color){c.fillStyle=color;c.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
const tileCanvas=document.createElement('canvas');
tileCanvas.width=17;tileCanvas.height=17;
const tileCtx=tileCanvas.getContext('2d',{willReadFrequently:true});
function rebuildTile(tile){
 const c=tileCtx;c.clearRect(0,0,17,17);
 for(const l of tile.leaves){
   if(l.gone===foliageGeneration)continue;
   const x=Math.round(l.ox-tile.baseX)+3,y=Math.round(l.oy-tile.baseY)+3,sz=l.size;
   if(l.shape===0)tilePixel(c,x,y,sz,sz,l.col);
   else if(l.shape===1){tilePixel(c,x,y,sz,sz,l.col);if(sz>2)tilePixel(c,x+1,y-1,1,1,l.col)}
   else if(l.shape===2){tilePixel(c,x,y,sz+1,1,l.col);tilePixel(c,x+1,y+1,sz>1?2:1,1,l.col)}
   else if(l.shape===3){tilePixel(c,x,y,1,sz+1,l.col);tilePixel(c,x-1,y+1,2,1,l.col)}
   else{tilePixel(c,x,y,sz,2,l.col);if(sz>2)tilePixel(c,x+2,y-1,1,1,l.col)}

function pixelCurve(a,b,c){

   const t=i/steps,mt=1-t;
   const x=mt*mt*a.x+2*mt*t*b.x+t*t*c.x;
   const y=mt*mt*a.y+2*mt*t*b.y+t*t*c.y;

   if(rand()<.09){s.solo.push(l);continue}

// Pixel-exact foliage compositor. Each tiny tile is flattened ONCE into its

// Colors/alpha and painter's order remain unchanged (no approximate sprites).
const foliageCanvas=document.createElement('canvas');
foliageCanvas.width=W;foliageCanvas.height=H;
const foliageCtx=foliageCanvas.getContext('2d',{alpha:true});

function packedColor(hex){

function compileTile(tile){

function stampTile(tile,x,y){

  for(let i=0;i<pixels.length;i+=2){
   const dx=x+pixels[i]%W,dy=y+Math.floor(pixels[i]/W);

}
function foliageRect(x,y,w,h,c){

// Falling particles remain lightweight; deposited leaves are painted once to an

const flyers=[];
const pileCanvas=document.createElement('canvas');

const pileCtx=pileCanvas.getContext('2d',{alpha:true});

const pileDepth=new Uint16Array(W);

   // Gravity is always positive. Air resistance caps descent, while flutter
   // modulates falling SPEED rather than y-position (no upward animation).
   l.vy=Math.min(l.terminal,l.vy+.018*l.fall*f);
   l.vx*=Math.pow(l.drag,f);
   l.x+=(l.vx+Math.cos(time*l.swayRate+l.phase)*l.sway)*f;
   const flutter=.90+.1*Math.sin(time*(l.spin*.34)+l.phase);
   l.y+=Math.max(.075,l.vy*flutter)*f;
   l.rot+=l.angVel*dt;
   // The contact region occupies only the central 5% of the visible leaf area.
   // Its width and height each equal sqrt(.05) of the rendered leaf size.
   // Test the centre and both horizontal ends, without a wider neighbour halo.
   const leafStretch=Math.max(.22,Math.abs(Math.cos(l.rot)));
   const leafW=Math.max(1,Math.round(l.size*leafStretch));
   const leafH=Math.max(1,Math.round(l.size*(1.45-leafStretch)));
   const coreHalfW=leafW*Math.sqrt(.05)*.5;
   const coreHalfH=leafH*Math.sqrt(.05)*.5;
   const contactX=l.x+leafW*.5;
   const contactY=l.y+leafH*.5+coreHalfH;
   if(contactX>=0&&contactX<W && contactY>=Math.min(
       pileSurface(contactX-coreHalfW,0),pileSurface(contactX,0),pileSurface(contactX+coreHalfW,0))){
     l.contactX=contactX;
     depositLeaf(l);
     flyers.splice(i,1);
   }else if(l.y>H+12||l.x<-20||l.x>W+20){
     flyers.splice(i,1);
   }
 }
}
function drawParticles(){
 ctx.drawImage(initialPileCanvas,0,0);
 ctx.drawImage(pileCanvas,0,0);
 for(const l of flyers){
   const stretch=Math.max(.22,Math.abs(Math.cos(l.rot)));
   const w=Math.max(1,Math.round(l.size*stretch));
   const h=Math.max(1,Math.round(l.size*(1.45-stretch)));
   block(l.x,l.y,w,h,l.color);
   if(l.size>2&&stretch>.55)block(l.x+1,l.y-1,1,1,l.color);
 }
}
// The original grass / earth line is gone: the cached initial leaf carpet is
// visually composed with new fallen leaves, without contributing to collision.
function draw(){
 ctx.clearRect(0,0,W,H);
 drawSprays(-1);
 drawPixelWood();
 drawSprays(1);
 drawParticles();
}
// Continue identical physics and shedding offscreen, but skip invisible raster work.
// Repaint the latest state as soon as the tree enters the viewport.
let renderVisible=true;
if('IntersectionObserver' in window){
 new IntersectionObserver(entries=>{
   renderVisible=entries[0].isIntersecting;
   if(renderVisible)draw();
 }).observe(stage);
}
function frameStep(dt){
 time+=dt;frame++;hoverFlow*=Math.exp(-dt*3.9);
 clickGusts=clickGusts.filter(g=>time-g.start<6);
 globalFlow=windAt(300,130,time);
 updateTree(dt);
 if(!reduced && frame%3===0){
   // Natural continuous shedding is uncommon; forceful wind can release small drifts.
   const p=Math.min(.65,Math.max(0,Math.abs(globalFlow)-.15)*.32);
   if(rand()<p){releaseFromSpray(choose(sprays),.6,Math.sign(globalFlow)||1)}
 }
 updateParticles(dt);
 if(renderVisible)draw();
}
function tick(now){
 if(!last)last=now;
 const dt=Math.min(.033,(now-last)/1000);last=now;
 frameStep(reduced&&!grabbed?Math.min(dt,.002):dt);
 requestAnimationFrame(tick);
}
function pos(e){const b=stage.getBoundingClientRect();return {x:(e.clientX-b.left)*W/b.width,y:(e.clientY-b.top)*H/b.height}}
function down(e){
 const v=pos(e);pointer=v;prevPointer=v;
 let best=null,dMin=1e9;
 for(const s of sprays){const d=Math.hypot((s.node.x-v.x)/s.rx,(s.node.y-v.y)/s.ry);if(d<dMin){dMin=d;best=s}}
 if(best&&dMin<1.5){
    grabbed={node:best.node,startX:v.x,startY:v.y};
    stage.classList.add('grabbing');stage.setPointerCapture(e.pointerId);
    shedNear(best.node,ri(16,26),.82);
    e.preventDefault();
 }else if(v.x>282&&v.x<327&&v.y>213&&v.y<297){
    clickGusts.push({start:time,power:.85,dir:v.x<303?-1:1});
 }
}
function move(e){const v=pos(e);const dx=v.x-prevPointer.x,dy=v.y-prevPointer.y;hoverFlow=clamp(hoverFlow+dx*.08,-2.5,2.5);if(grabbed){touchVel=.54*touchVel+.46*dx;const motion=Math.abs(dx)+Math.abs(dy);if(motion>1.6&&rand()<Math.min(.72,motion*.052))shedNear(grabbed.node,ri(4,7),.7+motion*.028,Math.sign(dx)||Math.sign(globalFlow)||1);}prevPointer=v;pointer=v;}
function up(e){
 if(!grabbed)return;
 const n=grabbed.node;
 let p=n;let atten=1;
 while(p&&p!==root){p.v+=clamp(touchVel*.052,-.95,.95)*atten;p=p.parent;atten*=.80}
 shedNear(n,ri(42,64),1.26);
 grabbed=null;touchVel=0;stage.classList.remove('grabbing');
 if(e&&stage.hasPointerCapture(e.pointerId))stage.releasePointerCapture(e.pointerId);
}
stage.addEventListener('pointerdown',down);
stage.addEventListener('pointermove',move);
stage.addEventListener('pointerup',up);
stage.addEventListener('pointercancel',up);
window.addEventListener('blur',()=>{grabbed=null;stage.classList.remove('grabbing')});
if(reduced)wind=0;
frameStep(1/60);requestAnimationFrame(tick);
})();
</script>
</body>
</html>
