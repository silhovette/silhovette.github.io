  #lighting-rig {
    position:fixed; left:50%; top:79%;
    width:min(42vw,520px); height:min(20vw,220px);
    --display-scale:1; --ring-shift:0px;
    transform:translate(-50%, calc(-50% + var(--ring-shift)))
      perspective(900px) rotateX(64deg) scale(var(--display-scale));
    transform-origin:center;
    pointer-events:none; z-index:0; mix-blend-mode:screen;
  }
  #lighting-rig::before {
    content:""; position:absolute; inset:-14% -10%;
    background:radial-gradient(ellipse at 50% 58%,
      rgba(255,255,255,.16) 0%,
      rgba(255,255,255,.05) 38%,
      rgba(255,255,255,0) 72%);
    filter:blur(18px); opacity:.72;
  }
  #lighting-rig::after {
    content:""; position:absolute; left:24%; right:24%; bottom:16%; height:135%;
    background:linear-gradient(to top, rgba(255,255,255,.10), rgba(255,255,255,0) 68%);
    filter:blur(24px); opacity:.45;
  }
  .light-beam {
    position:absolute; left:27%; right:27%; bottom:18%; height:145%;
    background:radial-gradient(ellipse at 50% 100%,
      rgba(255,255,255,.10) 0%,
      rgba(255,255,255,.035) 34%,
      rgba(255,255,255,0) 74%);
    filter:blur(18px); opacity:.5;
  }
  .light-halo {
    position:absolute; inset:8% 2%; border-radius:50%;
    background:radial-gradient(ellipse,
      rgba(255,255,255,.08) 0%,
      rgba(255,255,255,.025) 42%,
      rgba(255,255,255,0) 74%);
    filter:blur(10px);
  }
  .light-ring {
    position:absolute; inset:8%; border-radius:50%;
    background:transparent;
    border:8px solid rgba(255,255,255,.98);
    box-shadow:
      0 0 4px rgba(255,255,255,.95),
      0 0 12px rgba(255,255,255,.52);
  }
  .light-ring::after {
    content:""; position:absolute; inset:2px; border-radius:50%;
    border:2px solid rgba(255,255,255,.58);
    filter:blur(1px);
  }
  #viewer {
    position:fixed; inset:0; z-index:1;
    cursor:grab; touch-action:none; background:transparent;
  }
  #viewer:active { cursor:grabbing; }
  canvas {
    position:absolute; inset:0; display:block;
    width:100%; height:100%; pointer-events:none;
  }
  #glow {
    filter:blur(4px) brightness(1.18);
    opacity:.32; mix-blend-mode:screen;
  }
  #solid { opacity:1; }
  @media (max-width:700px) {
    #lighting-rig { width:62vw; height:25vw; top:82%; }
  }
</style>

}
root.addEventListener('pointerdown',e=>{e.preventDefault();root.setPointerCapture(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);lastInput=performance.now();lastPinch=0;});
root.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId))return;
 const old=pointers.get(e.pointerId);pointers.set(e.pointerId,[e.clientX,e.clientY]);
 if(pointers.size===1){
  const dx=e.clientX-old[0],dy=e.clientY-old[1];
  let delta=quatMul(axisQ([0,1,0],dx*.008),axisQ([1,0,0],dy*.008));
  q=normQ(quatMul(delta,q));
 }else if(pointers.size===2){
  const ps=[...pointers.values()];let d=Math.hypot(ps[0][0]-ps[1][0],ps[0][1]-ps[1][1]);
  if(lastPinch>0)zoom=Math.max(.3,Math.min(7,zoom*(d/lastPinch)));lastPinch=d;
 }
 lastInput=performance.now();
});
function stopPointer(e){pointers.delete(e.pointerId);lastPinch=0;lastInput=performance.now();}
root.addEventListener('pointerup',stopPointer);root.addEventListener('pointercancel',stopPointer);root.addEventListener('lostpointercapture',stopPointer);
root.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.3,Math.min(7,zoom*Math.exp(-e.deltaY*.0011)));lastInput=performance.now();},{passive:false});
root.addEventListener('dblclick',e=>{e.preventDefault();q=initial.slice();zoom=INITIAL_ZOOM;lastInput=performance.now();});
root.addEventListener('contextmenu',e=>e.preventDefault());

let atlas=null,tiles=[],animatedTiles=[];
function loadImage(src){return new Promise((resolve,reject)=>{let img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src='data:image/png;base64,'+src;});}
function frameToTile(tile,frame,nextBlend){
 const temp=tile.canvas;const ctx=tile.ctx;
 ctx.clearRect(0,0,256,256);ctx.imageSmoothingEnabled=false;
 const image=tile.image;
 ctx.drawImage(image,0,frame*tile.frameH,tile.w,tile.frameH,0,0,256,256);
 if(nextBlend>0){ctx.globalAlpha=nextBlend;ctx.drawImage(image,0,((frame+1)%tile.frames)*tile.frameH,tile.w,tile.frameH,0,0,256,256);ctx.globalAlpha=1;}
 return temp;
}
async function initTextures(){
 const imgs=await Promise.all(DATA.textures.map(t=>loadImage(t.png)));
 const atlasC=document.createElement('canvas');atlasC.width=DATA.atlasW;atlasC.height=DATA.atlasH;
 const actx=atlasC.getContext('2d',{willReadFrequently:false});actx.imageSmoothingEnabled=false;
 tiles=DATA.textures.map((t,i)=>{
  const {png,...metadata}=t;
  const tile={...metadata,image:null,canvas:null,ctx:null,shown:-1};
  if(t.frames>1 || fallback2D){
   const temp=document.createElement('canvas');temp.width=temp.height=256;
   tile.image=imgs[i];tile.canvas=temp;tile.ctx=temp.getContext('2d');
   frameToTile(tile,0,0);actx.drawImage(temp,t.x,t.y);
  }else{
   // Same nearest-neighbor pixels, without a persistent canvas per static tile.
   actx.drawImage(imgs[i],0,0,t.w,t.frameH,t.x,t.y,256,256);
  }
  return tile;
 });
 animatedTiles=tiles.filter(t=>t.frames>1);
 for(const renderer of renderers){const gl=renderer.gl;gl.bindTexture(gl.TEXTURE_2D,renderer.tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,atlasC);}
 // Only animated tiles (or the original software fallback) need decoded images.
 DATA.textures=null;
 atlasC.width=atlasC.height=1;
 atlas=true;
}
function animTextures(ms){
 if(!atlas)return;
 for(const t of animatedTiles){
  const time=ms/(t.frameTime*50);
  const frame=Math.floor(time)%t.frames;
  const interpolation=t.interpolate?Math.floor((time-Math.floor(time))*8)/8:0;
  const state=frame*16+Math.round(interpolation*8);
  if(state===t.shown)continue;
  t.shown=state;
  frameToTile(t,frame,interpolation);
  for(const r of renderers){const gl=r.gl;gl.bindTexture(gl.TEXTURE_2D,r.tex);gl.texSubImage2D(gl.TEXTURE_2D,0,t.x,t.y,gl.RGBA,gl.UNSIGNED_BYTE,t.canvas);}
 }
}
const fallback2D=renderers.length===0;
function fallbackRingLight(normal,center){
  let diffuse=0;
  for(let i=0;i<RING_SAMPLE_COUNT;i++){
    const o=i*3;const dx=ringLights[o]-center[0],dy=ringLights[o+1]-center[1],dz=ringLights[o+2]-center[2];
    const dist2=Math.max(dx*dx+dy*dy+dz*dz,.08);const inv=1/Math.sqrt(dist2);
    const ndl=Math.max(0,normal[0]*dx*inv+normal[1]*dy*inv+normal[2]*dz*inv);
    diffuse+=ndl/(1+dist2*1.45);
  }
  return diffuse*(RING_ENERGY/RING_SAMPLE_COUNT);
}
function fallbackTopLight(normal,center){
  let diffuse=0;
  for(let i=0;i<TOP_SAMPLE_COUNT;i++){
    const o=i*3;const dx=topLights[o]-center[0],dy=topLights[o+1]-center[1],dz=topLights[o+2]-center[2];
    const dist2=Math.max(dx*dx+dy*dy+dz*dz,.08);const inv=1/Math.sqrt(dist2);
    const ndl=Math.max(0,normal[0]*dx*inv+normal[1]*dy*inv+normal[2]*dz*inv);
    diffuse+=ndl/(1+dist2*.90);
  }
  return diffuse*(TOP_ENERGY/TOP_SAMPLE_COUNT);
}
const ctx2=fallback2D?canvas.getContext('2d',{alpha:true}):null;
const ctxGlow2=fallback2D?glowCanvas.getContext('2d',{alpha:true}):null;
let lastSoftDraw=0;
function affineTexture(ctx,img,pts,uv){
  // Orthographic projection preserves face planar affine maps.
  const du1=uv[1][0]-uv[0][0], dv1=uv[1][1]-uv[0][1];
  const du2=uv[3][0]-uv[0][0], dv2=uv[3][1]-uv[0][1];
  const det=du1*dv2-du2*dv1;
  if(Math.abs(det)<0.00001)return;
  const dx1=pts[1][0]-pts[0][0],dy1=pts[1][1]-pts[0][1];
  const dx2=pts[3][0]-pts[0][0],dy2=pts[3][1]-pts[0][1];
  const a=(dx1*dv2-dx2*dv1)/det,b=(dy1*dv2-dy2*dv1)/det;
  const c=(du1*dx2-du2*dx1)/det,d=(du1*dy2-du2*dy1)/det;
  const e=pts[0][0]-a*uv[0][0]-c*uv[0][1];
  const f=pts[0][1]-b*uv[0][0]-d*uv[0][1];
  ctx.save();ctx.beginPath();
  ctx.moveTo(...pts[0]);for(let i=1;i<4;i++)ctx.lineTo(...pts[i]);ctx.closePath();ctx.clip();
  ctx.setTransform(a,b,c,d,e,f);ctx.drawImage(img,0,0);ctx.restore();
}
function softRender(mat,halfW,halfH,cw,ch){
  // Texture-mapped orthographic polygon fallback for restricted/WebGL-disabled browsers.
  for(const [target,context] of [[canvas,ctx2],[glowCanvas,ctxGlow2]]){
    if(target.width!==cw||target.height!==ch){target.width=cw;target.height=ch;}
    context.clearRect(0,0,cw,ch);
  }
  if(!tiles.length)return;
  const faces=[];
  const F=verts.length/36;
  const atlasCols=Math.round(DATA.atlasW/260);
  for(let i=0;i<F;i++){
    const off=i*36;
    const g=verts[off+8];
    const normal=transform(mat,[verts[off+5],verts[off+6],verts[off+7]]);
    if(normal[2]<0.0002)continue;
    let pts=[],uv=[],depth=0,center=[0,0,0];
    for(let n=0;n<4;n++){
      const o=off+n*9;const p=transform(mat,[verts[o],verts[o+1],verts[o+2]]);p[1]+=MODEL_Y_OFFSET;
      pts.push([(p[0]/halfW+1)*cw*.5,(1-p[1]/halfH)*ch*.5]);
      uv.push([verts[o+3]*DATA.atlasW,verts[o+4]*DATA.atlasH]);depth+=p[2];
       center[0]+=p[0];center[1]+=p[1];center[2]+=p[2];
    }
    const ix=Math.floor(uv[0][0]/260),iy=Math.floor(uv[0][1]/260);
    const tex=tiles[iy*atlasCols+ix];if(!tex)continue;
    const tuv=uv.map(t=>[t[0]-tex.x,t[1]-tex.y]);
    center[0]*=.25;center[1]*=.25;center[2]*=.25;
    const ring=fallbackRingLight(normal,center);
    const top=fallbackTopLight(normal,center);
    const shade=Math.max(0.05,Math.min(1,0.05+ring*1.90+top*1.05));
    faces.push({pts,tuv,tex,depth:depth/4,g,shade});
  }
  faces.sort((a,b)=>a.depth-b.depth);
  for(const face of faces){
    affineTexture(ctx2,face.tex.canvas,face.pts,face.tuv);
    if(face.g<.5){
      ctx2.beginPath();ctx2.moveTo(...face.pts[0]);for(let i=1;i<4;i++)ctx2.lineTo(...face.pts[i]);
      ctx2.closePath();ctx2.fillStyle=`rgba(0,0,0,${(1-face.shade)*.69})`;ctx2.fill();
    }else{
      affineTexture(ctxGlow2,face.tex.canvas,face.pts,face.tuv);
    }
  }
}

const drawRotation=new Float64Array(9),drawMatrix=new Float32Array(9);
function draw(now){
 if(!mcViewer.tick(now))return;
 const dt=Math.min(0.06,(now-lastFrame)/1000);lastFrame=now;
 syncLightingRig();
 if(pointers.size===0 && now-lastInput>=AUTO_ROTATION_DELAY){const sin=Math.sin(dt*.08),cos=Math.cos(dt*.08);
  const x=q[0],y=q[1],z=q[2],w=q[3];
  q[0]=cos*x+sin*z;q[1]=cos*y+sin*w;q[2]=cos*z-sin*x;q[3]=cos*w-sin*y;
  const length=Math.hypot(q[0],q[1],q[2],q[3]);for(let i=0;i<4;i++)q[i]/=length;}
 if(renderers.length){
  animTextures(now);
  const dpr=Math.min(window.devicePixelRatio||1,2);
  const cw=Math.max(1,Math.round(window.innerWidth*dpr));const ch=Math.max(1,Math.round(window.innerHeight*dpr));
  const aspect=cw/ch,mat=rot3(q,drawRotation);
  let halfH=fixedSpan(aspect)/zoom;
  let halfW=halfH*aspect;
  // matrix uniforms are column-major (transpose of the JS row-major matrix)
  const matrix=drawMatrix;
  matrix[0]=mat[0];matrix[1]=mat[3];matrix[2]=mat[6];matrix[3]=mat[1];matrix[4]=mat[4];matrix[5]=mat[7];matrix[6]=mat[2];matrix[7]=mat[5];matrix[8]=mat[8];
  for(const r of renderers){
   let gl=r.gl,el=gl.canvas;
   if(r.width!==cw||r.height!==ch){el.width=cw;el.height=ch;r.width=cw;r.height=ch;gl.viewport(0,0,cw,ch);}
   gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
   if(!atlas)continue;
   gl.uniformMatrix3fv(r.rotLoc,false,matrix);
   if(r.halfW!==halfW||r.halfH!==halfH){gl.uniform2f(r.viewLoc,halfW,halfH);r.halfW=halfW;r.halfH=halfH;}
   if(r.isGlow){
     // Occlude glow behind the actual weapon geometry before additive bloom.
     gl.colorMask(false,false,false,false);gl.depthMask(true);gl.disable(gl.BLEND);
     gl.uniform1f(r.passLoc,-1);gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);
     gl.colorMask(true,true,true,true);gl.depthMask(false);gl.enable(gl.BLEND);
     gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.glowIndexBuffer);
     gl.uniform1f(r.passLoc,1);gl.drawElements(gl.TRIANGLES,r.glowCount,gl.UNSIGNED_SHORT,0);
     gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,r.indexBuffer);
     gl.depthMask(true);
   }else{gl.drawElements(gl.TRIANGLES,indices.length,gl.UNSIGNED_SHORT,0);}
  }
 } else if(atlas && now-lastSoftDraw>=50){
  lastSoftDraw=now;
  const dpr=Math.min(window.devicePixelRatio||1,1.5);
  const cw=Math.max(1,Math.round(window.innerWidth*dpr)),ch=Math.max(1,Math.round(window.innerHeight*dpr));
  const aspect=cw/ch,mat=rot3(q,drawRotation);
  const halfH=fixedSpan(aspect)/zoom;
  softRender(mat,halfH*aspect,halfH,cw,ch);
 }
 mcViewer.request(draw);
}
initTextures().catch(err=>console.error('Texture initialization failed',err));
mcViewer.request(draw);
</script>
