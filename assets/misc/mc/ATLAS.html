  .wheel:after{content:"";position:absolute;top:4px;left:5px;width:1px;height:5px;background:rgba(210,220,235,.9)}
  .fallback{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);color:#b7c2cf;text-align:center;font-size:14px;line-height:1.8}
  @media(max-width:620px){.hint{top:20px;right:20px;font-size:8px;letter-spacing:.10em}.name{font-size:9px;letter-spacing:.11em}}
</style>
